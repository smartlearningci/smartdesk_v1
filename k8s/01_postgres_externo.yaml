# PostgreSQL existente no Docker Compose; nao cria BD nem volume.
# Substituir o marcador pelo IPv4 REAL do contentor db na rede partilhada.
apiVersion: v1
kind: Service
metadata:
  name: postgres-compose
  namespace: default
spec:
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-compose-1
  namespace: default
  labels:
    kubernetes.io/service-name: postgres-compose
    endpointslice.kubernetes.io/managed-by: smartdesk-lab
addressType: IPv4
ports:
  - name: postgres
    protocol: TCP
    port: 5432
endpoints:
  - addresses:
      - "SUBSTITUIR_PELO_IP_REAL_DO_DB"
    conditions:
      ready: true
